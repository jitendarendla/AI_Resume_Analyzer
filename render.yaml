services:
  # -------------------------------------------------------------
  # 1. FastAPI Backend Web Service
  # -------------------------------------------------------------
  - type: web
    name: ai-resume-analyzer-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "uvicorn app.main:app --host 0.0.0.0 --port ${PORT:-10000}"
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM_EMAIL
        value: AI Resume Analyzer <onboarding@resend.dev>
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: ai-resume-analyzer-db
          property: connectionString

  # -------------------------------------------------------------
  # 2. Next.js Frontend Web Service
  # -------------------------------------------------------------
  - type: web
    name: ai-resume-analyzer-frontend
    env: node
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 20.10.0
      - key: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY
        value: pk_test_c291bmQtZ3VwcHktNzAuY2xlcmsuYWNjb3VudHMuZGV2JA
      - key: CLERK_SECRET_KEY
        sync: false
      - key: NEXT_PUBLIC_API_URL
        fromService:
          type: web
          name: ai-resume-analyzer-backend
          property: host

# -------------------------------------------------------------
# 3. PostgreSQL Database
# -------------------------------------------------------------
databases:
  - name: ai-resume-analyzer-db
    databaseName: resume_analyzer_db
    user: resume_user
    region: oregon
    plan: free
